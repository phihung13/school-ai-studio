name: build-and-deploy

# Mỗi lần push lên nhánh chính: build Docker image → đẩy lên GHCR → (tùy chọn) gọi Coolify API redeploy.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # cần để đẩy image lên ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tên & tag image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}   # tự hạ về chữ thường
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tự redeploy trên Coolify: chỉ chạy khi đặt repo variable VPS_DEPLOY=true và đủ 3 secret bên dưới.
  # Coolify tự PULL image ':latest' mới nhất từ GHCR khi nhận lệnh deploy này — không cần SSH.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.VPS_DEPLOY == 'true' }}
    steps:
      - name: Gọi Coolify API → redeploy (kéo image mới)
        run: |
          set -e
          curl -fsS -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
